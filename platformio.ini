; PlatformIO Project Configuration File
; MBox-M4P-IO — 5 路按键 → MBox 流媒体页面切换(0x24)
; 参考工程：D:\Ardunio\project\ESP32-voicebox\ESP32-voicebox

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; 自定义分区表（含 OTA + LittleFS 1.44MB，沿用参考工程）
board_build.partitions = partitions.csv

; 文件系统
board_build.filesystem = littlefs

; 串口端口 + 波特率
upload_port   = COM4
monitor_port  = COM4
monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=2
    ; 日志级别: 0=None, 1=Error, 2=Warn, 3=Info, 4=Debug, 5=Verbose
    ; 设为 2 (Warn) 可以抑制 VFS 的 Error 日志

    ; ─── CAN（SN65HVD230 3.3V 模块）─────────────────────────────
    ; CAN_BAUD: 125000 / 250000 / 500000 / 800000 / 1000000
    ; CAN_MODE: 0=NORMAL(接真实设备，总线上需有其它节点回 ACK)
    ;           1=NO_ACK(单机台架自测，不需要 ACK，可配合自发自收)
    ;           2=LISTEN_ONLY(只听，不发送、不 ACK)
    -DCAN_BAUD=500000
    -DCAN_MODE=0

    ; ─── 5 路按键（按键板 S1~S5 + COM，S6~S8 不接线）──────────────
    ; KEY_COM_TO_GND: 1=COM 接 GND + 内部上拉（默认，按下为 LOW）
    ;                 0=COM 接 3V3 + 内部下拉（按下为 HIGH）
    -DKEY_COM_TO_GND=1
    -DKEY_DEBOUNCE_MS=25
    ; 引脚探测模式：只打印按键落在哪个 GPIO，不发送 CAN（首次核对接线时打开）
    ; -DKEY_PIN_SCAN=1

    ; ─── 0x24「流媒体显示切换」发送策略 ─────────────────────────
    ; KEY_TX_REPEAT            按一下连发几帧（页面值幂等，重复无副作用，防丢帧）
    ; KEY_TX_REPEAT_GAP_MS     补发帧间隔
    ; KEY_PAGE_MUTEX_MS        同一个键连按抑制时间
    ; CAN_CTRL_KEEPALIVE_MS    0=只按键时发（默认）
    ;                          100=空闲也按协议周期发保活帧（B3=0x00 不改变页面）
    -DKEY_TX_REPEAT=3
    -DKEY_TX_REPEAT_GAP_MS=20
    -DKEY_PAGE_MUTEX_MS=300
    -DCAN_CTRL_KEEPALIVE_MS=0

    ; 串口调试命令（k1~k5 模拟按键 / p 统计 / t 报文表），量产可设为 0
    -DENABLE_SERIAL_SIM=1

    ; ─── 后续接入 ESPAsyncWebServer 时必须打开（默认 4KB 栈不够）───
    ; -DCONFIG_ASYNC_TCP_STACK_SIZE=16384
    ; -DCONFIG_ASYNC_TCP_RUNNING_CORE=1

    ; ─── 功能模块宏控（接入时按需启用，与参考工程保持一致）───
    ; -DENABLE_AUDIO=1       语音播报（I2S + MP3 解码器）
    ; -DENABLE_BUZZER=1      蜂鸣器（GPIO19，5V 有源，高电平触发）
    ; -DENABLE_LIGHT=1       三级预警灯（WS2812B 灯带 GPIO22）
    ; -DLIGHT_OUTPUT=0       0=WS2812 灯带  1=有源蜂鸣器（需 ENABLE_BUZZER=1）
    ; -DLIGHT_DATA_PIN=22    灯带数据脚覆盖

; 依赖库：按需启用（以下版本已在参考工程验证通过）
; lib_deps =
;     mathieucarbou/ESPAsyncWebServer @ ^3.3.23
;     mathieucarbou/AsyncTCP @ ^3.3.2
;     bblanchon/ArduinoJson @ ^6.21.3
;     earlephilhower/ESP8266Audio @ ^1.9.7
